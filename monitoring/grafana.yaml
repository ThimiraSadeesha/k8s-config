# Grafana OSS. The admin password comes from the grafana-admin Secret, created by hand
# (see README); it is never stored in this repo.
apiVersion: v1
kind: ConfigMap
metadata: { name: grafana-datasources, namespace: monitoring }
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: VictoriaMetrics
      uid: vm
      type: prometheus
      access: proxy
      url: http://victoria-metrics:8428
      isDefault: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: grafana-data, namespace: monitoring }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: grafana, namespace: monitoring }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      securityContext: { fsGroup: 472 }
      containers:
      - name: grafana
        image: grafana/grafana:11.3.0
        env:
        - { name: GF_SECURITY_ADMIN_USER, value: admin }
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom: { secretKeyRef: { name: grafana-admin, key: admin-password } }
        - { name: GF_SERVER_ROOT_URL, value: "https://grafana.auren.rest" }
        - { name: GF_USERS_ALLOW_SIGN_UP, value: "false" }
        - { name: GF_ANALYTICS_REPORTING_ENABLED, value: "false" }
        - { name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false" }
        ports: [{ containerPort: 3000 }]
        resources:
          requests: { cpu: 50m, memory: 128Mi }
          limits: { memory: 256Mi }
        readinessProbe: { httpGet: { path: /api/health, port: 3000 }, initialDelaySeconds: 10 }
        volumeMounts:
        - { name: data, mountPath: /var/lib/grafana }
        - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
      volumes:
      - { name: data, persistentVolumeClaim: { claimName: grafana-data } }
      - { name: datasources, configMap: { name: grafana-datasources } }
---
apiVersion: v1
kind: Service
metadata: { name: grafana, namespace: monitoring }
spec:
  selector: { app: grafana }
  ports: [{ port: 80, targetPort: 3000 }]
