apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
- ../../base
- ingress.yaml
- backups.yaml
images:
- { name: ghcr.io/thimirasadeesha/k8s-app-api, newTag: latest }
- { name: ghcr.io/thimirasadeesha/k8s-app-backend, newTag: latest }
- { name: ghcr.io/thimirasadeesha/k8s-app-ui, newTag: latest }
- { name: ghcr.io/thimirasadeesha/k8s-app-frontend, newTag: latest }
patches:
# 2 replicas minimum for the apps; HPA scales up from there
- target: { kind: Deployment, name: k8s-app-api }
  patch: |-
    - { op: replace, path: /spec/replicas, value: 2 }
- target: { kind: Deployment, name: k8s-app-backend }
  patch: |-
    - { op: replace, path: /spec/replicas, value: 2 }
- target: { kind: Deployment, name: k8s-app-ui }
  patch: |-
    - { op: replace, path: /spec/replicas, value: 2 }
- target: { kind: Deployment, name: k8s-app-frontend }
  patch: |-
    - { op: replace, path: /spec/replicas, value: 2 }
- target: { kind: HorizontalPodAutoscaler, name: k8s-app-api }
  patch: |-
    - { op: replace, path: /spec/minReplicas, value: 2 }
    - { op: replace, path: /spec/maxReplicas, value: 3 }
- target: { kind: HorizontalPodAutoscaler, name: k8s-app-backend }
  patch: |-
    - { op: replace, path: /spec/minReplicas, value: 2 }
    - { op: replace, path: /spec/maxReplicas, value: 4 }
- target: { kind: HorizontalPodAutoscaler, name: k8s-app-ui }
  patch: |-
    - { op: replace, path: /spec/minReplicas, value: 2 }
    - { op: replace, path: /spec/maxReplicas, value: 3 }
- target: { kind: HorizontalPodAutoscaler, name: k8s-app-frontend }
  patch: |-
    - { op: replace, path: /spec/minReplicas, value: 2 }
    - { op: replace, path: /spec/maxReplicas, value: 3 }
# bigger DB memory and caches in prod
- target: { kind: StatefulSet, name: postgres }
  patch: |-
    - { op: replace, path: /spec/template/spec/containers/0/args, value: ["-c", "shared_buffers=128MB", "-c", "max_connections=80", "-c", "work_mem=4MB"] }
    - { op: replace, path: /spec/template/spec/containers/0/resources/requests/memory, value: 256Mi }
    - { op: replace, path: /spec/template/spec/containers/0/resources/limits/memory, value: 512Mi }
    - { op: replace, path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage, value: 10Gi }
- target: { kind: StatefulSet, name: mariadb }
  patch: |-
    - { op: replace, path: /spec/template/spec/containers/0/args, value: ["--innodb-buffer-pool-size=192M", "--max-connections=80", "--performance-schema=OFF"] }
    - { op: replace, path: /spec/template/spec/containers/0/resources/requests/memory, value: 256Mi }
    - { op: replace, path: /spec/template/spec/containers/0/resources/limits/memory, value: 512Mi }
    - { op: replace, path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage, value: 10Gi }
