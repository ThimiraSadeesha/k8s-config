# k8s.auren.rest      -> k8s-app-ui (/), and /api -> k8s-app-api (same origin, no CORS needed)
# api.k8s.auren.rest  -> k8s-app-api (all paths; NestJS routes live under /api)
# The fullstack app is in ingress-fullstack.yaml, not enabled until its DNS records exist.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apps
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  tls:
  - hosts: [k8s.auren.rest, api.k8s.auren.rest]
    secretName: apps-tls
  rules:
  - host: k8s.auren.rest
    http:
      paths:
      - { path: /api, pathType: Prefix, backend: { service: { name: k8s-app-api, port: { number: 80 } } } }
      - { path: /, pathType: Prefix, backend: { service: { name: k8s-app-ui, port: { number: 80 } } } }
  - host: api.k8s.auren.rest
    http:
      paths:
      - { path: /, pathType: Prefix, backend: { service: { name: k8s-app-api, port: { number: 80 } } } }
