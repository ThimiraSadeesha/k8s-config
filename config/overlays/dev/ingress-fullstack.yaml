# ZENT at dev.zent.auren.rest (needs a DNS A record -> 51.79.158.90).
# A separate Ingress and certificate, so a missing DNS record cannot block the main one.
# The UI proxies /api/v1 to the backend itself, so only the UI is exposed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fullstack
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  tls:
  - hosts: [dev.zent.auren.rest]
    secretName: fullstack-tls
  rules:
  - host: dev.zent.auren.rest
    http:
      paths:
      - { path: /, pathType: Prefix, backend: { service: { name: k8s-app-frontend, port: { number: 80 } } } }
