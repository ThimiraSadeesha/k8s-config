apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
- ../../base
- ingress.yaml
images:
- { name: ghcr.io/thimirasadeesha/k8s-app-api, newTag: "35458251" }
- { name: ghcr.io/thimirasadeesha/k8s-app-ui, newTag: "7be86248" }
# dev: fixed single replicas, no autoscaling
patches:
- target: { kind: HorizontalPodAutoscaler, name: k8s-app-api }
  patch: |-
    $patch: delete
    apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata: { name: k8s-app-api }
- target: { kind: HorizontalPodAutoscaler, name: k8s-app-ui }
  patch: |-
    $patch: delete
    apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata: { name: k8s-app-ui }
