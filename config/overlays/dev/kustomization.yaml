apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
- ../../base
- ingress.yaml
- ingress-fullstack.yaml
images:
- { name: ghcr.io/thimirasadeesha/k8s-app-api, newTag: "5079f271" }
- { name: ghcr.io/thimirasadeesha/k8s-app-ui, newTag: "7be86248" }
- { name: ghcr.io/thimirasadeesha/k8s-app-backend, newTag: latest }
- { name: ghcr.io/thimirasadeesha/k8s-app-frontend, newTag: latest }
# dev: 1 pod normally; the base HPAs (cpu 70%, max 2) scale api, ui and frontend up under load.
# Quota: 640Mi steady; all three scaled out is 960Mi, so the last one can be refused by the 900Mi quota.
patches:
- target: { kind: Deployment, name: k8s-app-backend }
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata: { name: k8s-app-backend }
    spec:
      template:
        spec:
          containers:
          - name: k8s-app-backend
            env:
            - { name: PUBLIC_URL, value: "https://dev.zent.auren.rest" }
            - { name: CORS_ORIGINS, value: "https://dev.zent.auren.rest" }
