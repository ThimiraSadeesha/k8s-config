apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
- ../../base
- ingress.yaml
- ingress-fullstack.yaml
images:
- { name: ghcr.io/thimirasadeesha/k8s-app-api, newTag: "5079f271" }
- { name: ghcr.io/thimirasadeesha/k8s-app-ui, newTag: "7be86248" }
- { name: ghcr.io/thimirasadeesha/k8s-app-backend, newTag: "4a135e47" }
- { name: ghcr.io/thimirasadeesha/k8s-app-frontend, newTag: "4a135e47" }
# dev: 1 pod normally; the base HPAs (cpu 70%, max 2) scale api and ui up under load.
# Quota math: 480Mi steady + 1 extra api + 1 extra ui + rollout surge stays under the 900Mi quota.
patches:
# the fullstack frontend stays at 1 pod in dev to keep inside the quota
- target: { kind: HorizontalPodAutoscaler, name: k8s-app-frontend }
  patch: |-
    $patch: delete
    apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata: { name: k8s-app-frontend }
- target: { kind: Deployment, name: k8s-app-backend }
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata: { name: k8s-app-backend }
    spec:
      template:
        spec:
          containers:
          - name: k8s-app-backend
            env:
            - { name: PUBLIC_URL, value: "https://dev.zent.auren.rest" }
            - { name: CORS_ORIGINS, value: "https://dev.zent.auren.rest" }
