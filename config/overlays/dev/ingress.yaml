# Two sites on one node:
#   dev.example.com       -> k8s-app-ui (/) + k8s-app-api (/api, NestJS)
#   dev-full.example.com  -> k8s-app-frontend (/) + k8s-app-backend (/api, Go)
# NestJS needs app.setGlobalPrefix('api'); the Go server serves routes under /api.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apps
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  tls:
  - hosts: [dev.example.com, dev-full.example.com]
    secretName: apps-tls
  rules:
  - host: dev.example.com
    http:
      paths:
      - { path: /api, pathType: Prefix, backend: { service: { name: k8s-app-api, port: { number: 80 } } } }
      - { path: /, pathType: Prefix, backend: { service: { name: k8s-app-ui, port: { number: 80 } } } }
  - host: dev-full.example.com
    http:
      paths:
      - { path: /api, pathType: Prefix, backend: { service: { name: k8s-app-backend, port: { number: 80 } } } }
      - { path: /, pathType: Prefix, backend: { service: { name: k8s-app-frontend, port: { number: 80 } } } }
