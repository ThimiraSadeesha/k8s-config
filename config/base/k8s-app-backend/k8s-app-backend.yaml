# ZENT API (FastAPI). Login sessions live in this pod's memory, so it runs as a single replica
# with no HPA: a second pod would not know the first one's sessions. A restart signs everyone out.
# PUBLIC_URL and CORS_ORIGINS are set per environment in the overlays.
apiVersion: apps/v1
kind: Deployment
metadata: { name: k8s-app-backend }
spec:
  replicas: 1
  selector: { matchLabels: { app: k8s-app-backend } }
  template:
    metadata: { labels: { app: k8s-app-backend, tier: api } }
    spec:
      containers:
      - name: k8s-app-backend
        image: ghcr.io/thimirasadeesha/k8s-app-backend:latest
        ports: [{ containerPort: 8000 }]
        env:
        - { name: APP_ENV, value: production }
        - { name: TRUSTED_PROXY_COUNT, value: "1" }   # Traefik
        - name: ENCRYPTION_KEY
          valueFrom: { secretKeyRef: { name: k8s-app-secrets, key: ENCRYPTION_KEY } }
        resources:
          requests: { cpu: 25m, memory: 64Mi }
          limits: { memory: 192Mi }
        readinessProbe:
          httpGet: { path: /healthz, port: 8000 }
          initialDelaySeconds: 5
        livenessProbe:
          httpGet: { path: /healthz, port: 8000 }
          initialDelaySeconds: 20
---
apiVersion: v1
kind: Service
metadata: { name: k8s-app-backend }
spec:
  selector: { app: k8s-app-backend }
  ports: [{ port: 80, targetPort: 8000 }]
