apiVersion: v1
kind: Service
metadata: { name: mariadb }
spec:
  clusterIP: None
  selector: { app: mariadb }
  ports: [{ port: 3306 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: mariadb }
spec:
  serviceName: mariadb
  replicas: 1
  selector: { matchLabels: { app: mariadb } }
  template:
    metadata: { labels: { app: mariadb, tier: db } }
    spec:
      containers:
      - name: mariadb
        image: mariadb:11
        args:
        - --innodb-buffer-pool-size=64M
        - --max-connections=50
        - --performance-schema=OFF
        ports: [{ containerPort: 3306 }]
        env:
        - name: MARIADB_ROOT_PASSWORD
          valueFrom: { secretKeyRef: { name: mariadb-secret, key: MARIADB_ROOT_PASSWORD } }
        resources:
          requests: { cpu: 50m, memory: 128Mi }
          limits: { memory: 256Mi }
        readinessProbe:
          exec: { command: ["healthcheck.sh", "--connect", "--innodb_initialized"] }
          initialDelaySeconds: 10
        volumeMounts:
        - { name: data, mountPath: /var/lib/mysql }
  volumeClaimTemplates:
  - metadata: { name: data }
    spec:
      accessModes: [ReadWriteOnce]
      resources: { requests: { storage: 5Gi } }
