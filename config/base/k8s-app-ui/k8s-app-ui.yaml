apiVersion: apps/v1
kind: Deployment
metadata: { name: k8s-app-ui }
spec:
  replicas: 1
  selector: { matchLabels: { app: k8s-app-ui } }
  template:
    metadata: { labels: { app: k8s-app-ui, tier: web } }
    spec:
      containers:
      - name: k8s-app-ui
        image: ghcr.io/thimirasadeesha/k8s-app-ui:latest
        ports: [{ containerPort: 3000 }]
        env:
        - { name: NODE_ENV, value: production }
        - { name: HOSTNAME, value: "0.0.0.0" }
        resources:
          requests: { cpu: 50m, memory: 96Mi }
          limits: { memory: 192Mi }
        readinessProbe:
          httpGet: { path: /, port: 3000 }
          initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: k8s-app-ui }
spec:
  selector: { app: k8s-app-ui }
  ports: [{ port: 80, targetPort: 3000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: k8s-app-ui }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: k8s-app-ui }
  minReplicas: 1
  maxReplicas: 2
  metrics:
  - type: Resource
    resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
