# ZENT UI (Next.js). It proxies /api/v1 to the k8s-app-backend Service (address baked in at build time).
apiVersion: apps/v1
kind: Deployment
metadata: { name: k8s-app-frontend }
spec:
  replicas: 1
  selector: { matchLabels: { app: k8s-app-frontend } }
  template:
    metadata: { labels: { app: k8s-app-frontend, tier: web } }
    spec:
      containers:
      - name: k8s-app-frontend
        image: ghcr.io/thimirasadeesha/k8s-app-frontend:latest
        ports: [{ containerPort: 3000 }]
        env:
        - { name: NODE_ENV, value: production }
        - { name: HOSTNAME, value: "0.0.0.0" }
        # same key as the backend: the browser fetches it at runtime to encrypt API traffic
        - name: ENCRYPTION_KEY
          valueFrom: { secretKeyRef: { name: k8s-app-secrets, key: ENCRYPTION_KEY } }
        resources:
          requests: { cpu: 25m, memory: 96Mi }
          limits: { memory: 192Mi }
        readinessProbe:
          httpGet: { path: /, port: 3000 }
          initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: k8s-app-frontend }
spec:
  selector: { app: k8s-app-frontend }
  ports: [{ port: 80, targetPort: 3000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: k8s-app-frontend }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: k8s-app-frontend }
  minReplicas: 1
  maxReplicas: 2
  metrics:
  - type: Resource
    resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
