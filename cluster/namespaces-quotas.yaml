apiVersion: v1
kind: Namespace
metadata: { name: dev }
---
apiVersion: v1
kind: Namespace
metadata: { name: prod }
---
apiVersion: v1
kind: ResourceQuota
metadata: { name: dev-quota, namespace: dev }
spec:
  hard:
    requests.cpu: "600m"
    requests.memory: 700Mi
    limits.memory: 1400Mi
    persistentvolumeclaims: "4"
---
apiVersion: v1
kind: ResourceQuota
metadata: { name: prod-quota, namespace: prod }
spec:
  hard:
    requests.cpu: "1500m"
    requests.memory: 1800Mi
    limits.memory: 3Gi
    persistentvolumeclaims: "6"
---
# Defaults so pods without explicit resources still satisfy the quota
apiVersion: v1
kind: LimitRange
metadata: { name: defaults, namespace: dev }
spec:
  limits:
  - type: Container
    default: { memory: 128Mi }
    defaultRequest: { cpu: 25m, memory: 64Mi }
---
apiVersion: v1
kind: LimitRange
metadata: { name: defaults, namespace: prod }
spec:
  limits:
  - type: Container
    default: { memory: 256Mi }
    defaultRequest: { cpu: 50m, memory: 64Mi }
